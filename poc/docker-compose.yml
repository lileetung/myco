services:
  mock_site:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./mock_site/html/${SITE_VERSION:-v1}:/usr/share/nginx/html:ro

  scraper:
    build: ./scraper
    restart: unless-stopped
    depends_on:
      - mock_site
    environment:
      - SCRAPER_URL=http://mock_site
      - SCRAPE_INTERVAL=10
    volumes:
      - ./workspace:/workspace
