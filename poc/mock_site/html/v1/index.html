<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Acme Widget Pro - Shop</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 960px; margin: 2em auto; padding: 0 1em; background: #fff; color: #222; }
    .container { border: 1px solid #ddd; padding: 1.5em; }
    .product-row { display: flex; gap: 2em; align-items: flex-start; }
    .product-img { width: 240px; height: 240px; background: #eee; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 7em; color: #999; }
    .product-title { font-size: 1.8em; margin: 0 0 0.5em; color: #222; }
    .price { font-size: 1.5em; color: #c00; margin: 0.5em 0; font-weight: bold; }
    .sku { color: #666; font-size: 0.9em; margin: 0.4em 0; }
    .description { margin: 1em 0; line-height: 1.5; color: #333; }
    .btn { padding: 0.8em 2em; background: #07c; color: white; border: 0; cursor: pointer; font-size: 1em; }
  </style>
</head>
<body>
  <div class="container">
    <div class="product-row">
      <div class="product-img">⚙️</div>
      <div class="product-info">
        <h1 class="product-title">Acme Widget Pro</h1>
        <div class="price">$49.99</div>
        <div class="sku">SKU: WGT-001</div>
        <p class="description">A great widget for all your widgeting needs.</p>
        <button class="btn">Add to Cart</button>
      </div>
    </div>
  </div>
</body>
</html>
